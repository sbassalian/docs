    child_brands: true
  - path: /content/spikes
    method: get
    page: api-reference/endpoint/content/spikes
    title: Spike days
    child_brands: true
  - path: /content/day_breakdown
    method: get
    page: api-reference/endpoint/content/day-breakdown
    title: What drove a day
    child_brands: true
  - path: /content/breakout_posts
    method: get
    page: api-reference/endpoint/content/breakout-posts
