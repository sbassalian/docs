# Allow-list for scripts/sync_openapi.rb: the public endpoints copied from the
# backend's OpenAPI spec (swagger/v1/swagger.yaml) into api-reference/openapi.json.
#
# Per entry:
#   path, method   the public path (without `prefix`) and HTTP verb
#   page           the page to generate, without .mdx. Leave it out to update the spec only
#   title          sidebar and page title (defaults to the backend summary)
#   description    public description of the endpoint (replaces the backend's)
#   replaces       deprecated pages this endpoint replaces; the page links them
#   notes          extra MDX shown under the generated reference
#   child_brands   true when organization_id picks a child brand (adds the 404)
#   rate_limit_exempt  true for endpoints outside the rate limits (no 429)
#   pending        true until the backend ships it; the coming-soon page stays until then
#
# texts: backend descriptions that mention internals, mapped to public wording (null drops one).
#
# Endpoints that aren't listed here are still written by hand in openapi.json.
# To move one over, delete it there, add it here and rerun.

prefix: /api/public/v1

texts:
  post report returned: The posting report

paths:
  # Content analytics: the Home page's numbers.
  - path: /content/summary
    method: get
    page: api-reference/endpoint/content/summary
    title: Content summary
    replaces: [api-reference/endpoint/get-content-24h-data, api-reference/endpoint/get-creators-24h]
    child_brands: true
  - path: /content/series
    method: get
    page: api-reference/endpoint/content/series
    title: Content series
    replaces: [api-reference/endpoint/get-snapshots]
    child_brands: true
